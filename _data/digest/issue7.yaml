  Reference: 'Ryo Harada, Yuki Nishimura, Mami Nomura, Akinori Yabuki, Kogiku Shiba, Kazuo Inaba, Yuji Inagaki, Takuro Nakayama. bioRxiv 2025.05.02.651781'
