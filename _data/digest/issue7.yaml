- Author: Sukalyan Deb
  Affiliation: "Department of Physical Sciences, IISER Kolkata"
  Title: Superconductivity in a 5' twisted bilayer WSe2
  Summary: 'Twisted bilayer graphene is a paradigmatic platform in the regime of the strongly correlated system, and "twisted" here refers to the slight rotation between the layers of graphene(~1.1'') , known as the magic angle, which creates a unique electronic structure with ''flat bands''. The flat band suppresses the kinetic energy relative to the coulomb enabling rich phases like  magnetic ordering,  unconventional superconductivity, and Chern ferromagnets , and associated quantum anomalous Hall states which appears depends sensitively on carrier density, displacement field, twist-angle homogeneity, and substrate alignment. A closely related  material is twisted bilayer tungsten diselenide (tWSe\(_2\)),formed from two monolayers of the transition-metal dichalcogenide (TMD) but it also brings crucial new ingredients: strong spin-orbit coupling, robust spin-valley locking.  These features reshape the effective low-energy models (often mapped to extended Hubbard models with valley degrees of freedom) and provide powerful electric-field control of bandwidth, band topology, and valley polarization. Experimentally, unconventional superconductivity has been reported in tWSe\(_2\) at a 5-degree twist with applying an external electric field. 


  At small twist angles, the two layers hybridize strongly and generate bands whose bandwidth can be comparable to the on-site interaction U , placing the system in an intermediate-coupling regime. In this window, neither a weak-coupling metal nor a fully Mott-localized insulator is guaranteed ; modest changes in control parameters can tip the balance. A perpendicular displacement field is especially powerful, distorts the bands, shifts van Hove singularities (critical points in the electronic band structure where the slope of the energy dispersion is zero) . Transport reflects this tunability ,without the twist the resistivity  is metallic across dopings and displacement fields--decreasing with temperature and showing no sign of a gap. As the twist angle brings the system into the flat-band regime and the displacement field is tuned, the normal state can evolve from a conventional metal to a correlated metal with enhanced scattering . Upon approaching optimal fillings--where the density of states is elevated and screening is reduced--the system enters a superconducting phase, typically forming a dome in the displacement-field-density plane. On the flanks of this dome , indicating that pairing emerges in close proximity to other interaction-driven orders.In flat-band graphene systems, people have proposed that ordinary phonon-mediated pairing could produce superconductivity, and similar ideas exist for tWSe\(_2\) . This close tie between superconductivity and magnetism points instead to a magnetically mediated pairing mechanism, e.g. via spin fluctuations, rather than conventional phonons. 


  The study offers a fresh perspective on the interplay between magnetic ordering and superconductivity that goes beyond the scope of standard transport measurements. It also provides a useful comparison with known graphene and TMD systems, highlighting the crucial role played by twist angle in shaping these correlated phases.'
  Url: https://doi.org/10.1038/s41586-024-08381-1
  Caption: 'FIG (a) Resistance as a function of temperature, showing a clear drop to zero below the critical temperature at a specific twist angle, indicating the onset of a superconducting phase.

    FIG (b) Field-tuning at a fixed filling, illustrating a transition from an ordered magnetic phase into the superconducting dome.'
  Reference: 'Guo, Y., Pack, J., Swann, J. et al. Superconductivity in 5.0° twisted bilayer WSe2. Nature 637, 839–845 (2025)'
