  Title: "When a Cyclone Shakes the Sky: How Super Cyclone Amphan Disturbed Earth''s Upper Atmosphere"
  Summary: "Tropical cyclones are usually studied for the destruction they cause at Earth''s surface--strong winds, heavy rainfall, storm surges, and flooding. This study shows that their influence does not stop there. Using Super Cyclone Amphan (May 2020) over the Bay of Bengal as a case study, we demonstrate that intense tropical cyclones can also disturb the upper layers of Earth''s atmosphere, including regions that host satellites and radio communication systems.\n\nThe most interesting finding of this work is the clear, multi-altitude link between intense cyclone-driven convection, lightning activity, atmospheric gravity waves, and disturbances in the lower ionosphere. By combining observations from several satellites, we show that Amphan''s powerful convective clouds and strong lightning activity generated atmospheric gravity waves--ripples in the atmosphere similar to waves produced when a stone is thrown into water. These waves traveled upward from the lower atmosphere through the stratosphere and mesosphere, reaching the lower thermosphere and ionosphere.\n\nA particularly novel aspect of this study is its detailed focus on cloud-to-cloud (CC) lightning, which has been largely overlooked in cyclone studies over the Indian region. We find that CC lightning intensified during Amphan''s rapid strengthening phase, especially within the eyewall region, and that a large fraction of these flashes were high-energy and positively charged. This lightning behaviour closely followed the cyclone''s intensification and weakening, suggesting that CC lightning can serve as a valuable indicator of strong internal storm dynamics.\n\nWhy does this matter? For the space-weather and ionospheric community, this study strengthens the evidence that weather systems near Earth''s surface can directly affect the near-space environment through gravity waves. Such disturbances can influence radio wave propagation, satellite drag, and navigation systems like GPS. For meteorologists and climate scientists, the results highlight lightning and gravity waves as key but under-represented components of cyclone dynamics, offering new pathways to improve storm monitoring and modelling.\n\nMore broadly, this work enriches Earth system science by demonstrating how tightly connected different atmospheric layers are--from the ocean-driven cyclone at the surface to electrical and wave processes over 100 km above Earth. By bridging meteorology, atmospheric electricity, and space physics, this study helps move us closer to a truly integrated understanding of how extreme weather events impact the entire Earth-atmosphere-space system.\n"
  Url: https://doi.org/10.1016/j.jastp.2025.106654
  Caption: "(a) Daily distribution of Outgoing Longwave Radiation (OLR) at 12:00 UT from 15 to 20 May 2020, illustrating the evolution of convective activity associated with Super Cyclone Amphan over the Bay of Bengal. Regions of low OLR values indicate deep and intense convection, corresponding to the development, rapid intensification, mature, and weakening phases of the cyclone. (b) Corresponding Thermal Infrared (TIR1) satellite images showing cloud-top brightness temperature (CTBT) at 10.8 μm, acquired by the INSAT-3D satellite at 12:00 UT during the same period. Extremely low cloud-top temperatures highlight the presence of strong updrafts, deep convective clouds, and well-developed mesoscale convective systems within the cyclone''s eyewall and rain-band regions. Together, panels (a) and (b) provide a comprehensive view of the temporal evolution of convective intensity during different stages of Super Cyclone Amphan."
  Reference: 'O. M. Patil, D. Kar, N. Parihar, R. Singh, and A. P. Dimri, Journal of Atmospheric and Solar-Terrestrial Physics, vol. 277, p. 106654, Oct. 2025'
  Image: digest-27.svg
