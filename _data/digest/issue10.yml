- Author: Swarnendu Saha
  Caption: ''
  Image: digest3.svg
  Keywords:
  - Atmospheric Rivers
  - Atmospheric Moisture Transport
  - Precipitation Variability
  - Extreme Precipitation
  - Climate Change
  Reference: Pradhan, S., Wasko, C. & Peel, M.C. npj Nat. Hazards 3, 68 (2026)
  Summary: " Atmospheric rivers (ARs) are narrow corridors in the atmosphere that transport large amounts of water vapour towards the mid-latitudes. When they reach land, particularly in coastal and mountainous regions, they can produce heavy rainfall and flooding. Although their importance is well established, their contribution to changes in average and extreme precipitation has not been examined consistently at the global scale. This study investigates changes in AR frequency and related precipitation between 1980 and 2019.\n\nThe authors combine precipitation estimates from the MSWEP V2 dataset with atmospheric river records derived from MERRA-2 reanalysis. To avoid relying on a single definition of an atmospheric river, they compare three detection methods. Rainfall occurring on a day when an AR is detected at the same grid cell is classified as AR-induced. Extreme rainfall is identified using a peaks-over-threshold approach based on the 90th percentile. Trends are estimated using Sen\u2019s slope, and their significance is assessed with the Mann\u2013Kendall test.\n\nThe results show that atmospheric rivers are major contributors to year-to-year precipitation variability across many mid-latitude regions. In parts of North America, western Europe, southern South America, southern Africa and Australia, AR-related precipitation explains more than 70% of this variability. The study also finds an increase in AR frequency at mid-to-high latitudes, alongside decreases in some subtropical regions. The increase is particularly evident over parts of the Southern Ocean and North Atlantic.\n\nBoth the frequency and magnitude of AR-associated precipitation have increased over the study period. The rise in AR-related extreme rainfall is especially apparent near landfall regions, including parts of northeastern North America, Brazil, western Africa, the Mediterranean coast, Japan and southeastern China. Here, concentrated moisture transport can interact with terrain and weather systems to produce intense rainfall.\n\nThe authors suggest that a warmer atmosphere, which can hold more moisture, and changes in storm-track positions may contribute to these trends. However, their method identifies rainfall and ARs occurring together; this does not, by itself, prove that an AR caused the rainfall. Detection algorithms also differ in the geographical extent of trends, although the main patterns are consistent across all three.\n\nOverall, the study indicates that atmospheric rivers are becoming more important to precipitation extremes and flood risk. The findings highlight the need for water-resource planning and flood-risk assessments to account for changing AR activity. Further research is needed to distinguish the effects of atmospheric warming, circulation changes and natural climate variability. "
  Title: 'When Rivers Flow Through the Sky: Atmospheric Rivers and the Changing Face of Global Rainfall'
  Url: https://doi.org/10.1038/s44304-026-00231-6
