  Caption: "Resonant X-ray scattering probes spin entanglement in the cuprate Sr<sub>2</sub>CuO<sub>3</sub>. The row of copper and oxygen atoms represents the material\u2019s nearly one-dimensional chain with antiferromagnetic arrangement of spins. An incoming X-ray scatters from the chain and leaves with a changed energy, carrying information about its spin excitations. The soft haze represents the broad response arising from quantum critical excitations, while the arcs indicate correlations extending across multiple spins. The study asks whether this scattering signal can reveal how many spins are entangled. By filtering out the appropriate spin-response from the X-ray signal, the researchers infer entanglement involving at least seven spins at 35 K."
