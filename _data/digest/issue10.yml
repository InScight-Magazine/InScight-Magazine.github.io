- Affiliation: PhD Scholar, DBS, IISER Kolkata
  Author: Shriparna Chattopadhyay
  Caption: The illustration summarises the SART(Sustained Attention to Response Task) paradigm which assesses how negative, neutral, and positive task-unrelated thoughts (TUTs) relate to attentional performance. Negative thoughts are more consistently associated with reduced accuracy, while positive thoughts show the strongest association with response-time variability.
  Image: digest2.jpeg
  Keywords:
  - Attention span
  - task related thoughts
  - sustained attention-to-response task
  - valence
  - psychology
  Reference: "Welhaf MS, Banks JB. J Exp Psychol Learn Mem Cogn. 51(2), 238\u2013254 (2025)"
  Summary: " Did you ever end up planning for a holiday trip or pondering about an unpleasant scenario while completing an important task of yours? Now, that is termed as \u2018mind wandering\u2019: when our attention shifts from an ongoing activity towards any unrelated thoughts. This ignited some minds to ask whether the emotional nature of thoughts (negative, positive or neutral) affect our attention?\n\nKeeping in mind that \u2018mind wandering\u2019 is generally associated with reduced task performance, a group of researchers carried out a simple yet interesting study to investigate whether negatively, positively and neutrally valenced task-unrelated thoughts (TUTs) have different relationships with sustained attention(Maintaining focus on a specific task over an extended period). They also noted whether these different types of thoughts become more frequent as a task progresses.\n\nFor the study the researchers pooled and analysed six datasets collected across several years involving participants aged 18-35 years, out of which most of them were university students. The participants were asked to perform a sustained attention-to-response task (SART):i.e.,\u2019to press the spacebar for animal words, but withhold the response for rare vegetable words. And at random intervals,the participants were interrupted with thought probes asking them to categorise their immediately preceding thoughts as positive, negative or neutral. The researchers compared these reports with measures of response-time variability (refers to how much a person's reaction time fluctuates from one to another during a task or how consistently or inconsistently someone responds) and task accuracy, using meta-analysis, and examined changes in thought frequency across successive task blocks.\n\nThe findings of the study revealed something intriguing: \u2018mind wandering\u2019 is not a uniform phenomenon and varies with the emotional content of our thoughts.Both pleasant(positive) and unpleasant(negative) thoughts can divert our attention from an ongoing task, though their effects may manifest differently.\n\nNegative thoughts may particularly disrupt the accuracy, while positive thoughts may contribute to fluctuations in response consistency. The researchers also found an increasing occurrence of neutral and negative thoughts over time (while doing the task).\n\nThis research concludes by focusing on the point that \u2018mind wandering\u2019 isn\u2019t only a matter of losing focus, the emotional nature of our wandering thoughts may also affect the consistency and accuracy of the attention we pay to do a task. "
  Title: 'The Wandering Mind: When Our Thoughts Steal Our Attention!'
  Url: https://doi.org/10.1037/xlm0001369
