- Affiliation: Department of Physics & Astronomy, Seoul National University
  Author: Abhirup Mukherjee
  Caption: "Resonant X-ray scattering probes spin entanglement in the cuprate Sr<sub>2</sub>CuO<sub>3</sub>. The row of copper and oxygen atoms represents the material\u2019s nearly one-dimensional chain with antiferromagnetic arrangement of spins. An incoming X-ray scatters from the chain and leaves with a changed energy, carrying information about its spin excitations. The soft haze represents the broad response arising from quantum critical excitations, while the arcs indicate correlations extending across multiple spins. The study asks whether this scattering signal can reveal how many spins are entangled. By filtering out the appropriate spin-response from the X-ray signal, the researchers infer entanglement involving at least seven spins at 35 K."
  Image: digest1.png
  Keywords:
  - strong-correlations
  - entanglement
  - materials-science
  Reference: S. F. R. TenHuisen et al., arXiv:2609.08134, Sept. 08, 2026
  Summary: " Entanglement is one of the distinguishing features of quantum mechanics and a core aspect of modern quantum condensed matter physics. Many of the interesting phenomena seen in the so called quantum materials bear their origin to intricate patterns of entanglement between the constituent particles. Yet, it is difficult to quantify entanglement measures in the laboratory: reconstructing a many-body quantum state requires measuring an exponentially large number of observables because of the exponential growth of the Hilbert space seen in systems of interacting particles. In this work, TenHuisen and colleagues ask whether resonant inelastic X-ray scattering (RIXS), a widely used probe of excitations in correlated materials, can instead witness entanglement through what's called an entanglement witness. Entanglement witnesses are quantities that are not as powerful as entanglement measures \u2013 they can detect whether a state has entanglement but cannot quantify the amount of entanglement. But their main advantage is that they can be experimentally measured. For example, in this work, the authors probe the **quantum Fisher information** (QFI) \u2013 an entanglement witness that can be linked to a dynamical spin structure factor. The spin structure factor roughly quantifies how likely it is that a system will be excited by a specific energy through a specific spin-flip process.\n\nTheir test case is Sr<sub>2</sub>CuO<sub>3</sub>, an insulator with strong magnetic interactions. It turns out that its low-energy state is quantum critical, which essentially means that the correlations within it span long distances. The low-energy excitations fractionalize into spinons, which means its quantum numbers are fractional. These long-range quantum fluctuations make the chain a promising place to find deep spin entanglement\u2014and a well-characterized setting in which to test a new measurement protocol.\n\nAs mentioned, the authors use QFI to probe the system. For a spin-$$\\frac{1}{2}$$ system, the QFI per spin above a value $$m$$ certifies entanglement involving at least $$m + 1$$ spins. The challenge is that RIXS intensity is not simply the spin structure factor: in an interacting many-body system, other processes always contribute. The work calculates the appropriate spin structure factor by combining the experimental data with theoretical calculations of relevant models using exact diagonalisation and density matrix renormalisation group (DMRG). At 35 K, the momentum-resolved QFI peaks at a value exceeding six, witnessing at least seven-partite spin entanglement. At 220 K, the witness remains above four near specific directions in momentum space, still certifying entanglement among at least five spins. The result shows that substantial multipartite correlations survive well above the lowest measurement temperature, because the chain\u2019s large exchange scale keeps it in the quantum regime.\n\nThis is a first demonstration of RIXS as a probe of multipartite spin entanglement in a solid. The inference depends on a material- and geometry-specific, theory-assisted mapping from RIXS intensity to the spin response, so it is not yet a model-free measure. Even so, the method opens a path toward testing entanglement in less tractable materials. "
  Title: Seeing entanglement in a cuprate spin chain
  Url: https://doi.org/10.48550/arXiv.2609.08134
