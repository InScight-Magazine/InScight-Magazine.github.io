questions:
  - "While studying atmospheric dynamics using early computer simulations, a mathematician noticed that extremely small changes in initial conditions could lead to vastly diﬀerent outcomes. This sensitivity to initial conditions later became a foundational idea in chaos theory and is popularly known as the “Butterﬂy Eﬀect.\" Which mathematician ﬁrst identiﬁed this phenomenon?"
  - "A reclusive Russian mathematician stunned the mathematical community in the early 2000s by resolving the century-old Poincaré Conjecture using Ricci ﬂow techniques. Despite this achievement, he declined both the Fields Medal and the \\$1,000,000 Clay Millennium Prize, citing ethical reasons and fairness toward other contributors. Who is this mathematician?"
  - "A famous unsolved problem number theory involves proving a conjecture that every even integer greater than 2 can be expressed as the sum of two prime numbers. This conjecture is part of the plot of the 2007 Spanish film Fermat's Room. Which conjecture are we talking about?"
  - "The term “googol,\" meaning a 1 followed by 100 zeroes, was coined in 1938 by the young nephew of American mathematician Edward Kasner. What was the boy’s name?"
  - "In the Fibonacci sequence ($1, 1, 2, 3, 5, 8, dots$), the ratio of consecutive terms approaches a ﬁxed irrational number as the sequence progresses. What is this number called?"
  - "One of the most important mathematical tools in science and engineering was developed independently in the 17th century by Sir Isaac Newton and Gottfried Wilhelm Leibniz. What is this tool?"
  - "In the decimal expansion of π, the ﬁrst occurrence of a digit repeating six times consecutively appears at the 762nd decimal place. Which digit repeats, and what is this point famously called?"
  - "One of the most celebrated formulas in mathematics links ﬁve fundamental constants -- $e, i, π, 1$, and 0 -- in a single elegant identity, $e^(i pi) + 1 = 0$. This equation is often regarded as the most beautiful in mathematics and arises from a deeper exponential relationship in complex analysis. Which mathematician ﬁrst formulated this relationship?"
  - "An ancient Greek mathematician, often referred to as the \"Father of Geometry,\" authored the inﬂuential work Elements, which served as the standard geometry textbook for more than 2,000 years. Who was this mathematician?"
  - "Amicable numbers are pairs of integers where each number equals the sum of the proper divisors of the other. In ancient times, these numbers were believed to promote which human emotion?"
  - "The development of non-Euclidean geometry in the 19th century profoundly altered our understanding of space and curvature. This mathematical framework later became essential to which of Albert Einstein’s
major theories?"
  - "In this picture you can see this has only one side. An ant walking along it covers what seems like both sides before returning to its origin, ﬂipped, showing no distinction between \"top\" and \"bottom\"."
